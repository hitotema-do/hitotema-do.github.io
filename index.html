<style>
:root { --bg: #F7F1E5; --ink: #2B2420; --sub: #7A6A5C; --red: #D2412F; --green: #0B6E6E; --line: #E2D9C8; --card: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 16px; line-height: 1.7; }
.band { height: 10px; background: var(--red); }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 32px; }
header { text-align: center; margin-bottom: 22px; }
.chara { width: 88px; height: 88px; border-radius: 50%; display: block; margin: 0 auto 6px; }
h1 { font-family: "Yuji Syuku", serif; font-weight: 400; font-size: 40px; letter-spacing: 0.15em; margin: 0; line-height: 1.3; }
.copy { margin: 6px 0 0; font-weight: 700; font-size: 15px; }
.copy em { font-style: normal; color: var(--red); }
.tag { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
.links { display: flex; flex-direction: column; gap: 12px; list-style: none; padding: 0; margin: 0; }
.links a { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; text-decoration: none; color: #fff; }
.links svg { flex: none; width: 28px; height: 28px; }
.links .t { font-weight: 700; font-size: 17px; line-height: 1.4; display: block; }
.links .s { font-size: 13px; display: block; opacity: 1; }
.links .go { margin-left: auto; font-size: 20px; }
.gomi { background: var(--green); } .gomi .s { color: #E1F5EE; }
.hoiku { background: var(--red); } .hoiku .s { color: #FAECE7; }
.note { background: var(--card); color: var(--ink) !important; border: 1.5px solid var(--ink); } .note .s { color: var(--sub); }
.small { text-align: center; color: var(--sub); font-size: 13px; margin: 20px 0 0; }
.small a { color: var(--ink); }
.foot { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12px; text-align: center; }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
<script>
// ひとてま堂の数え係：この入口ページを、この端末で1日1回だけ「+1」する（名前や端末を見分ける番号は送らない）。
// 作者の端末（アプリ側で「数えない」にしたもの）は数えない
(function () {
  try {
    if (localStorage.getItem("hitotema.count.off")) return;
    var KEY = "hitotema.page.top", page = "入口ページ";
    var day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    if (localStorage.getItem(KEY) === day) return;
    localStorage.setItem(KEY, day);
    var ref = ""; try { ref = new URL(document.referrer).hostname; if (ref === location.hostname) ref = "self"; } catch (e) {}
    navigator.sendBeacon("https://hitotema-count.hitotema-do.workers.dev/page",
      new Blob([JSON.stringify({ a: "gominavi", p: page, r: ref })], { type: "text/plain" }));
  } catch (e) {}
})();
</script>

<div class="band"></div>
<div class="wrap">

      <span><span class="t">note｜広島のニュース＋α</span><span class="s">公式資料で調べて整理しています</span></span><span class="go" aria-hidden="true">›</span></a></li>

  <div class="foot">広島市などの公開データをもとに、個人で作っています。広島市の公式サービスではありません。<br>© 2026 ひとてま堂</div>
</div>
<script>
// どこから来たか（?from=x など）を、アプリへのリンクに引き継ぐ。目印がなければ「入口ページから」
(function () {
  var from = (new URLSearchParams(location.search).get("from") || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 20) || "top";
  document.querySelectorAll("a[data-app]").forEach(function (a) {
    var u = new URL(a.href); u.searchParams.set("from", from); a.href = u.toString();
  });
})();
</script>
